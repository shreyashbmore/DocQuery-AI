# Optional services. DocQuery AI also runs without Docker
# (embedded Qdrant / in-memory store + Ollama installed natively).
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["./index/qdrant_server:/qdrant/storage"]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
volumes:
  ollama:
